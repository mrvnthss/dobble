[project]
name = "dobble"
version = "0.1.0"
description = "A Python package for generating individual Dobble playing cards and full decks with customizable emojis and layouts."
authors = [
    {name = "Marvin Theiss",email = "mrvnthss@mail.de"}
]
license = {text = "GPL-3.0-only"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy (>=1.26.2,<2.0.0)",
    "pandas (>=2.1.4,<3.0.0)",
    "pillow (>=10.1.0,<11.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
include = [
    "data/*"
]

[tool.poetry.group.dev.dependencies]
complexipy = "^0.3.3"
coverage = "^7.3.3"
jupyter = "^1.0.0"
matplotlib = "^3.9.0"
pylint = "^3.0.3"
pytest = "^7.4.3"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"
requests = "^2.32.2"
